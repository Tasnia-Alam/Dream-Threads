<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dream Threads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #755c82;
      --soft-purple: #947c9e;
      --pink: #efacd0;
      --light-pink: #fff4f9;
      --cream: #fffaf8;
      --lavender: #f2edff;
      --border: #f0dce8;
      --shadow: rgba(117, 92, 130, 0.14);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--purple);

      background:
        linear-gradient(
          180deg,
          #fff8f8,
          #fff0f7,
          #f7f0ff,
          #eef6ff
        );
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      color: inherit;
    }

    /* =========================
       HOME PAGE
       ========================= */

    #homePage {
      min-height: 100vh;
      position: relative;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
      text-align: center;
    }

    .welcome-card {
      position: relative;
      z-index: 2;

      width: min(610px, 92vw);
      padding: 62px 50px;

      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 36px;

      background: rgba(255, 255, 255, 0.56);
      box-shadow: 0 22px 60px var(--shadow);
      backdrop-filter: blur(10px);

      animation: appear 0.9s ease;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background:
        linear-gradient(
          145deg,
          #f7c4dd,
          #e5d8f5
        );

      color: white;
      font-family: Georgia, serif;
      font-size: 27px;
      font-weight: bold;

      box-shadow: 0 10px 24px rgba(183, 125, 161, 0.22);
    }

    h1 {
      margin: 0 0 15px;
      font-family: Georgia, serif;
      font-size: clamp(48px, 7vw, 72px);
      color: var(--purple);
      letter-spacing: -1px;
    }

    .tagline {
      margin: 0 0 38px;
      color: #7b707e;
      font-size: 21px;
    }

    .start-button {
      padding: 17px 42px;

      border: none;
      border-radius: 50px;

      background:
        linear-gradient(
          135deg,
          #f2acd0,
          #e7b9e5
        );

      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;

      box-shadow: 0 13px 30px rgba(190, 115, 158, 0.24);

      transition:
        transform 0.25s,
        box-shadow 0.25s;
    }

    .start-button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 17px 35px rgba(190, 115, 158, 0.3);
    }

    .floating {
      position: absolute;
      opacity: 0.55;
      animation: floatUp 10s infinite linear;
      pointer-events: none;
    }

    .floating-dot {
      width: 12px;
      height: 12px;

      border-radius: 50%;
      background: #f4bdd8;
      box-shadow:
        20px -8px 0 #e3d6f3,
        -16px -20px 0 #f9d9b5;
    }

    .floating-flower {
      width: 28px;
      height: 28px;
      position: absolute;
    }

    .floating-flower::before {
      content: "✦";
      color: #f2b98b;
      font-size: 27px;
    }

    @keyframes floatUp {
      from {
        transform: translateY(110vh) rotate(0deg);
      }

      to {
        transform: translateY(-120vh) rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       STUDIO
       ========================= */

    #studioPage {
      display: none;
      min-height: 100vh;
      padding: 20px;
    }

    .studio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 16px 22px;
      margin-bottom: 18px;

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 26px;

      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 30px var(--shadow);
      backdrop-filter: blur(9px);
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-family: Georgia, serif;
      font-size: 27px;
      font-weight: bold;
    }

    .small-logo {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background:
        linear-gradient(
          145deg,
          #f7c4dd,
          #e1d7f4
        );

      color: white;
      font-size: 18px;
    }

    .home-button {
      padding: 11px 18px;

      border: none;
      border-radius: 20px;

      background: #f5c5dd;
      color: #684f70;

      cursor: pointer;
      transition: 0.2s;
    }

    .home-button:hover {
      transform: translateY(-2px);
      background: #efb4d1;
    }

    .studio-layout {
      display: grid;
      grid-template-columns: 255px 1fr;
      gap: 18px;

      min-height: calc(100vh - 115px);
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      padding: 19px;

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 35px var(--shadow);
      backdrop-filter: blur(9px);
    }

    .sidebar h2 {
      margin: 1px 0 17px;
      font-family: Georgia, serif;
      font-size: 21px;
    }

    .tool-button {
      width: 100%;
      min-height: 49px;
      margin-bottom: 10px;
      padding: 11px 13px;

      display: flex;
      align-items: center;
      gap: 11px;

      border: 1px solid transparent;
      border-radius: 17px;

      background: rgba(255, 246, 251, 0.9);
      color: var(--purple);

      font-size: 15px;
      text-align: left;
      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s,
        border-color 0.2s;
    }

    .tool-button:hover {
      transform: translateX(4px);
      background: #f8e4ef;
      border-color: #efcede;
    }

    .line-icon {
      width: 29px;
      height: 29px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 10px;
      background: white;
      box-shadow: 0 5px 12px rgba(117, 92, 130, 0.08);
    }

    .line-icon svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: #9b7590;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       TEMPLATE PANEL
       ========================= */

    .tool-panel {
      display: none;

      margin: -2px 0 13px;
      padding: 9px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255, 250, 253, 0.94);
      animation: panelAppear 0.25s ease;
    }

    @keyframes panelAppear {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .template-choice {
      width: 100%;
      margin: 5px 0;
      padding: 9px;

      display: flex;
      align-items: center;
      gap: 10px;

      border: none;
      border-radius: 14px;

      background: white;
      color: var(--purple);

      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .template-choice:hover {
      transform: translateY(-2px);
      background: #f9eaf2;
    }

    .garment-icon {
      width: 41px;
      height: 41px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 13px;
      background:
        linear-gradient(
          145deg,
          #f7d4e5,
          #ede3f7
        );
    }

    .garment-icon svg {
      width: 25px;
      height: 25px;

      fill: rgba(255, 255, 255, 0.8);
      stroke: #9b7590;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .template-text strong,
    .template-text small {
      display: block;
    }

    .template-text strong {
      font-size: 13px;
    }

    .template-text small {
      margin-top: 3px;
      color: #9b8b9e;
      font-size: 10px;
    }

    /* =========================
       COLOR PICKER
       ========================= */

    .color-area {
      margin-top: 18px;
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255, 249, 252, 0.94);
    }

    .color-area label {
      display: block;
      margin-bottom: 9px;

      font-size: 13px;
      font-weight: bold;
    }

    #shirtColor {
      width: 100%;
      height: 42px;

      border: 1px solid #e7d4df;
      border-radius: 12px;

      background: white;
      cursor: pointer;
    }

    /* =========================
       WORKSPACE
       ========================= */

    .workspace {
      position: relative;
      overflow: hidden;

      min-height: 640px;
      padding: 35px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.64);
      box-shadow: 0 12px 35px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .corner-sparkle {
      position: absolute;
      top: 28px;
      left: 38px;

      color: #efb27e;
      font-size: 29px;
    }

    .corner-flower {
      position: absolute;
      right: 34px;
      bottom: 29px;

      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: #f5c2db;
      color: white;
      font-size: 21px;
    }

    .design-area {
      width: 100%;
      text-align: center;
    }

    .design-area h2 {
      margin: 0 0 25px;
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .garment-stage {
      min-height: 410px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       GARMENTS
       ========================= */

    #drawingCanvas {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  z-index: 5;
  cursor: crosshair;

  pointer-events: none;
  touch-action: none;
}

.garment.draw-active #drawingCanvas {
  pointer-events: auto;
}

    .garment {
  --garment-color: #ffffff;
  --fabric-texture: none;

      position: relative;

      width: 300px;
      height: 345px;

      border: 1px solid rgba(210, 195, 210, 0.35);
      border-radius: 38px 38px 60px 60px;

     background-color: var(--garment-color);
     background-image: var(--fabric-texture);

      
      box-shadow: 0 20px 38px rgba(90, 75, 100, 0.18);

      transition:
        width 0.35s,
        height 0.35s,
        border-radius 0.35s,
        background 0.3s;
    }

    .garment::before,
    .garment::after {
      content: "";

      position: absolute;
      top: 25px;

      width: 105px;
      height: 116px;

      border: 1px solid rgba(210, 195, 210, 0.22);
      border-radius: 35px;

      background-color: var(--garment-color);
      background-image: var(--fabric-texture);
      z-index: -1;
    }

    .garment::before {
      left: -69px;
      transform: rotate(25deg);
    }

    .garment::after {
      right: -69px;
      transform: rotate(-25deg);
    }

    .neck {
      width: 102px;
      height: 56px;

      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);

      border-radius: 0 0 58px 58px;
      background: #eee5f1;
    }

    .garment-message {
      position: absolute;
      top: 157px;
      width: 100%;

      color: #876f8c;
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: bold;
    }

    /* Dress */

    .garment.dress {
      width: 260px;
      height: 390px;

      clip-path:
        polygon(
          24% 0,
          76% 0,
          83% 31%,
          100% 100%,
          0 100%,
          17% 31%
        );

      border-radius: 34px 34px 95px 95px;
    }

    .garment.dress::before,
    .garment.dress::after {
      display: none;
    }

    .garment.dress .neck {
      width: 88px;
      height: 48px;
    }

    .garment.dress .garment-message {
      top: 180px;
    }

    /* Hoodie */

    .garment.hoodie {
      width: 320px;
      height: 360px;
      border-radius: 58px 58px 52px 52px;
    }

    .garment.hoodie::before,
    .garment.hoodie::after {
      width: 115px;
      height: 135px;
    }

    .garment.hoodie .neck {
      width: 128px;
      height: 78px;
      top: -17px;

      border: 3px solid #eee5f1;
      border-top: none;
      background: transparent;
    }

    .pocket {
      display: none;

      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);

      width: 130px;
      height: 65px;

      border: 2px solid rgba(135, 111, 140, 0.25);
      border-radius: 14px 14px 30px 30px;
    }

    .garment.hoodie .pocket {
      display: block;
    }

    .status {
      min-height: 43px;
      margin-top: 18px;
      padding: 12px 20px;

      display: inline-flex;
      align-items: center;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: rgba(255, 249, 252, 0.9);
      color: #806d83;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .studio-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: 2;
      }

      .workspace {
        min-height: 570px;
      }
    }

    @media (max-width: 520px) {
      .welcome-card {
        padding: 48px 23px;
      }

      .studio-brand {
        font-size: 20px;
      }

      .workspace {
        padding: 20px 8px;
      }

      .garment-stage {
        transform: scale(0.78);
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

  <!-- HOME PAGE -->

  <section id="homePage">

    <div
      class="floating floating-flower"
      style="left: 8%; animation-delay: 0s;"
    ></div>

    <div
      class="floating floating-dot"
      style="left: 24%; animation-delay: 3s;"
    ></div>

    <div
      class="floating floating-flower"
      style="left: 49%; animation-delay: 5s;"
    ></div>

    <div
      class="floating floating-dot"
      style="left: 73%; animation-delay: 1s;"
    ></div>

    <div
      class="floating floating-flower"
      style="left: 91%; animation-delay: 6s;"
    ></div>

    <div class="welcome-card">
      <div class="brand-mark">D</div>

      <h1>Dream Threads</h1>

      <p class="tagline">
        Where imagination becomes fashion.
      </p>

      <button
        class="start-button"
        onclick="openStudio()"
      >
        Start Designing
      </button>
    </div>

  </section>

  <!-- STUDIO PAGE -->

  <section id="studioPage">

    <header class="studio-header">

      <div class="studio-brand">
        <span class="small-logo">D</span>
        <span>Dream Threads Studio</span>
      </div>

      <button
        class="home-button"
        onclick="returnHome()"
      >
        ← Home
      </button>

    </header>

    <div class="studio-layout">

      <aside class="sidebar">

        <h2>Creative Tools</h2>

        <!-- TEMPLATES -->

        <button
          class="tool-button"
          onclick="showTemplates()"
        >
          <span class="line-icon">
            <svg viewBox="0 0 24 24">
              <path d="M8 4 5 6l-3 5 4 2 1-2v9h10v-9l1 2 4-2-3-5-3-2c-1 2-7 2-8 0Z"></path>
            </svg>
          </span>

          Templates
        </button>

        <div
          id="templatePanel"
          class="tool-panel"
        >

          <button
            class="template-choice"
            onclick="chooseTemplate('shirt')"
          >
            <span class="garment-icon">
              <svg viewBox="0 0 24 24">
                <path d="M8 4 5 6l-3 5 4 2 1-2v9h10v-9l1 2 4-2-3-5-3-2c-1 2-7 2-8 0Z"></path>
              </svg>
            </span>

            <span class="template-text">
              <strong>Classic Tee</strong>
              <small>A simple everyday canvas</small>
            </span>
          </button>

          <button
            class="template-choice"
            onclick="chooseTemplate('dress')"
          >
            <span class="garment-icon">
              <svg viewBox="0 0 24 24">
                <path d="M9 3h6l1 6 5 12H3L8 9l1-6Z"></path>
                <path d="M9 3c1 2 5 2 6 0"></path>
              </svg>
            </span>

            <span class="template-text">
              <strong>Dream Dress</strong>
              <small>A soft flowing silhouette</small>
            </span>
          </button>

          <button
            class="template-choice"
            onclick="chooseTemplate('hoodie')"
          >
            <span class="garment-icon">
              <svg viewBox="0 0 24 24">
                <path d="M8 5C9 2 15 2 16 5l3 2 3 5-4 2-1-2v9H7v-9l-1 2-4-2 3-5 3-2Z"></path>
                <path d="M9 5c1 3 5 3 6 0"></path>
                <path d="M9 17h6"></path>
              </svg>
            </span>

            <span class="template-text">
              <strong>Cozy Hoodie</strong>
              <small>A warm relaxed design</small>
            </span>
          </button>

        </div>

        <!-- DRAW -->

<button
  class="tool-button"
  id="drawButton"
  onclick="toggleDrawPanel()"
>
  <span class="line-icon">
    <svg viewBox="0 0 24 24">
      <path d="m4 20 4-1 11-11-3-3L5 16l-1 4Z"></path>
      <path d="m14 7 3 3"></path>
    </svg>
  </span>

  Draw
</button>

<div
  id="drawPanel"
  class="tool-panel"
>

  <p style="margin-top:0;font-weight:bold;">
    Drawing Studio
  </p>

  <label>Brush Color</label>

  <input
    type="color"
    id="brushColor"
    value="#9b5f83"
    style="width:100%;height:40px;"
  >

  <br><br>

  <label>Brush Size</label>

  <input
    type="range"
    id="brushSize"
    min="2"
    max="25"
    value="6"
    style="width:100%;"
  >

  <br><br>

  <button onclick="clearDrawing()">
    Clear Drawing
  </button>

</div>
        <!-- FABRICS -->

        <button
          class="tool-button"
          onclick="toggleFabricPanel()"
        >
          <span class="line-icon">
            <svg viewBox="0 0 24 24">
              <path d="M5 3h14v18H5z"></path>
              <path d="m5 8 14 8"></path>
              <path d="m5 16 14-8"></path>
            </svg>
          </span>

          Fabrics
        </button>

        <div
  id="fabricPanel"
  class="tool-panel"
>
  <p style="margin-top:0;font-weight:bold;">
    Fabric Library
  </p>
   <input
  type="search"
  id="fabricSearch"
  placeholder="🔍 Search fabrics..."
  style="
    width:100%;
    padding:10px 14px;
    border:1px solid #ead7e3;
    border-radius:14px;
    font-size:14px;
    outline:none;
    margin-top:8px;
    margin-bottom:10px;
  "
>  
<button
  class="template-choice"
  onclick="chooseFabric('cotton')"
>
  🧵 Cotton Fabric
</button>

          <button
    class="template-choice"
    onclick="chooseFabric('denim')"
>
    👖 Denim Fabric
</button>
         
</div>

        <!-- DECORATIONS -->

        <button
          class="tool-button"
          onclick="showMessage('Decorations will be added soon!')"
        >
          <span class="line-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3c1 4 4 5 8 5-3 2-4 5-3 9-3-2-6-2-10 0 1-4 0-7-3-9 4 0 7-1 8-5Z"></path>
            </svg>
          </span>

          Decorations
        </button>

        <!-- UPLOAD -->

        <button
          class="tool-button"
          onclick="openUpload()"
        >
          <span class="line-icon">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <circle cx="8" cy="9" r="1.5"></circle>
              <path d="m4 17 5-5 4 4 2-2 5 4"></path>
            </svg>
          </span>

          Upload Image
        </button>

        <input
          type="file"
          id="imageUpload"
          accept="image/*"
          hidden
          onchange="imageSelected()"
        >

        <!-- SAVE -->

        <button
          class="tool-button"
          onclick="showMessage('Saving designs will be added in a future version!')"
        >
          <span class="line-icon">
            <svg viewBox="0 0 24 24">
              <path d="M5 3h12l2 2v16H5z"></path>
              <path d="M8 3v6h8V3"></path>
              <path d="M8 14h8v7H8z"></path>
            </svg>
          </span>

          Save Design
        </button>

        <div class="color-area">

          <label for="shirtColor">
            Choose a garment color
          </label>

          <input
            type="color"
            id="shirtColor"
            value="#ffffff"
            oninput="changeGarmentColor()"
          >

        </div>

      </aside>

      <!-- WORKSPACE -->

      <main class="workspace">

        <div class="corner-sparkle">✦</div>
        <div class="corner-flower">✿</div>

        <div class="design-area">

          <h2 id="designTitle">
            Your Classic Tee
          </h2>

          <div class="garment-stage">

            <div
              class="garment"
              id="garment"
            >
             
              <canvas id="drawingCanvas"></canvas> 
             
              <div class="neck"></div>

              <div class="garment-message">
                Dream Big ✦
              </div>

              <div class="pocket"></div>
            </div>

          </div>

          <div
            class="status"
            id="statusMessage"
          >
            Choose a template or color to begin creating.
          </div>

        </div>

      </main>

    </div>

  </section>

  <script>
    function openStudio() {
      document.getElementById("homePage").style.display =
        "none";

      document.getElementById("studioPage").style.display =
        "block";
    }

    function returnHome() {
      document.getElementById("studioPage").style.display =
        "none";

      document.getElementById("homePage").style.display =
        "flex";
    }

    function showTemplates() {
      const panel =
        document.getElementById("templatePanel");

      if (panel.style.display === "block") {
        panel.style.display = "none";
      } else {
        panel.style.display = "block";
      }
    }

    function chooseTemplate(template) {
      const garment =
        document.getElementById("garment");

      const title =
        document.getElementById("designTitle");

      garment.classList.remove(
        "dress",
        "hoodie"
      );

      if (template === "shirt") {
        title.textContent =
          "Your Classic Tee";

        showMessage(
          "Classic Tee selected."
        );
      }

      if (template === "dress") {
        garment.classList.add("dress");

        title.textContent =
          "Your Dream Dress";

        showMessage(
          "Dream Dress selected."
        );
      }

      if (template === "hoodie") {
        garment.classList.add("hoodie");

        title.textContent =
          "Your Cozy Hoodie";

        showMessage(
          "Cozy Hoodie selected."
        );
      }
    }

    function changeGarmentColor() {
      const selectedColor =
        document.getElementById("shirtColor").value;

      const garment =
        document.getElementById("garment");

      garment.style.setProperty(
        "--garment-color",
        selectedColor
      );

      showMessage(
        "Your new color has been added."
      );
    }

    function showMessage(message) {
      document.getElementById(
        "statusMessage"
      ).textContent = message;
    }

function chooseFabric(fabric) {
  const garment = document.getElementById("garment");

  if (fabric === "cotton") {
    garment.style.setProperty(
      "--fabric-texture",
      `
        repeating-linear-gradient(
          0deg,
          rgba(120,100,110,0.16) 0px,
          rgba(120,100,110,0.16) 1px,
          transparent 1px,
          transparent 3px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.35) 0px,
          rgba(255,255,255,0.35) 1px,
          transparent 1px,
          transparent 3px
        )
      `
    );

    showMessage("Cotton fabric applied!");
  }

  else if (fabric === "denim") {
    garment.style.setProperty(
      "--fabric-texture",
      `
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.18) 0px,
          rgba(255,255,255,0.18) 2px,
          transparent 2px,
          transparent 6px
        )
      `
    );

    showMessage("Denim fabric applied!");
  }
}

    function toggleDrawPanel() {
  const panel = document.getElementById("drawPanel");
  const garment = document.getElementById("garment");

  if (panel.style.display === "block") {
    panel.style.display = "none";
    garment.classList.remove("draw-active");
    showMessage("Drawing tools closed.");
  } else {
    panel.style.display = "block";
    garment.classList.add("draw-active");

    resizeDrawingCanvas();

    showMessage("Drawing tools opened!");
  }
}

    function openUpload() {
      document.getElementById(
        "imageUpload"
      ).click();
    }

    function imageSelected() {
      const input =
        document.getElementById("imageUpload");

      if (input.files.length > 0) {
        showMessage(
          "Image selected! Placing images on clothing will be added next."
        );
      }
    }
const drawingCanvas = document.getElementById("drawingCanvas");
const drawingContext = drawingCanvas.getContext("2d");

let isDrawing = false;

function resizeDrawingCanvas() {
  const garment = document.getElementById("garment");
  const garmentBox = garment.getBoundingClientRect();

  drawingCanvas.width = Math.round(garmentBox.width);
  drawingCanvas.height = Math.round(garmentBox.height);

  drawingCanvas.style.width = garmentBox.width + "px";
  drawingCanvas.style.height = garmentBox.height + "px";

  drawingContext.lineCap = "round";
  drawingContext.lineJoin = "round";
}

function getDrawingPosition(event) {
  const canvasBox = drawingCanvas.getBoundingClientRect();

  const scaleX = drawingCanvas.width / canvasBox.width;
  const scaleY = drawingCanvas.height / canvasBox.height;

  return {
    x: (event.clientX - canvasBox.left) * scaleX,
    y: (event.clientY - canvasBox.top) * scaleY
  };
}

function startDrawing(event) {
  event.preventDefault();

  isDrawing = true;

  drawingCanvas.setPointerCapture(event.pointerId);

  const position = getDrawingPosition(event);

  drawingContext.beginPath();
  drawingContext.moveTo(position.x, position.y);

  drawingContext.strokeStyle =
    document.getElementById("brushColor").value;

  drawingContext.lineWidth =
    Number(document.getElementById("brushSize").value);
}

function drawOnGarment(event) {
  if (!isDrawing) {
    return;
  }

  event.preventDefault();

  const position = getDrawingPosition(event);

  drawingContext.strokeStyle =
    document.getElementById("brushColor").value;

  drawingContext.lineWidth =
    Number(document.getElementById("brushSize").value);

  drawingContext.lineTo(position.x, position.y);
  drawingContext.stroke();
}

function stopDrawing(event) {
  if (!isDrawing) {
    return;
  }

  isDrawing = false;
  drawingContext.closePath();

  if (
    event.pointerId !== undefined &&
    drawingCanvas.hasPointerCapture(event.pointerId)
  ) {
    drawingCanvas.releasePointerCapture(event.pointerId);
  }
}

function clearDrawing() {
  drawingContext.clearRect(
    0,
    0,
    drawingCanvas.width,
    drawingCanvas.height
  );

  showMessage("Drawing cleared.");
}

  function toggleFabricPanel() {
  const panel = document.getElementById("fabricPanel");

  if (panel.style.display === "block") {
    panel.style.display = "none";
  } else {
    panel.style.display = "block";
  }
}  

drawingCanvas.addEventListener("pointerdown", startDrawing);
drawingCanvas.addEventListener("pointermove", drawOnGarment);
drawingCanvas.addEventListener("pointerup", stopDrawing);
drawingCanvas.addEventListener("pointercancel", stopDrawing);

window.addEventListener("load", resizeDrawingCanvas);
window.addEventListener("resize", resizeDrawingCanvas);
    
  </script>

</body>
</html>
