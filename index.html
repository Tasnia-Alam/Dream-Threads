<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dream Threads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #705978;
      background: linear-gradient(
        180deg,
        #fff8f8,
        #ffeef6,
        #f7efff,
        #eef7ff
      );
    }

    button {
      font-family: inherit;
    }

    /* HOME PAGE */

    #homePage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
      padding: 30px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.55);
      padding: 60px 70px;
      border-radius: 35px;
      box-shadow: 0 20px 50px rgba(112, 89, 120, 0.15);
      backdrop-filter: blur(8px);
      animation: appear 1s ease;
    }

    h1 {
      font-size: 70px;
      margin: 0 0 15px;
      color: #7a5c88;
    }

    .tagline {
      font-size: 22px;
      color: #766f78;
      margin-bottom: 38px;
    }

    .start-button {
      padding: 18px 42px;
      font-size: 21px;
      border: none;
      border-radius: 50px;
      background: #f3acd0;
      color: white;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(193, 113, 156, 0.25);
      transition: 0.3s;
    }

    .start-button:hover {
      transform: translateY(-4px) scale(1.05);
      background: #eb95c2;
    }

    .floating {
      position: absolute;
      font-size: 25px;
      animation: floatUp 9s infinite linear;
      opacity: 0.65;
    }

    @keyframes floatUp {
      from {
        transform: translateY(110vh) rotate(0deg);
      }

      to {
        transform: translateY(-120vh) rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FASHION STUDIO */

    #studioPage {
      display: none;
      min-height: 100vh;
      padding: 22px;
    }

    .studio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      padding: 16px 24px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(112, 89, 120, 0.12);
      margin-bottom: 20px;
    }

    .studio-title {
      font-size: 27px;
      font-weight: bold;
      color: #7a5c88;
    }

    .home-button {
      border: none;
      background: #f5c3db;
      color: #684f70;
      padding: 11px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
    }

    .studio-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      min-height: calc(100vh - 115px);
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.72);
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(112, 89, 120, 0.12);
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .tool-button {
      width: 100%;
      margin-bottom: 12px;
      padding: 14px;
      border: none;
      border-radius: 18px;
      background: #fff5fa;
      color: #705978;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .tool-button:hover {
      background: #f8dceb;
      transform: translateX(4px);
    }

    .color-area {
      margin-top: 18px;
      padding: 14px;
      background: #fff8fc;
      border-radius: 18px;
    }

    .color-area label {
      display: block;
      margin-bottom: 9px;
      font-weight: bold;
    }

    #shirtColor {
      width: 100%;
      height: 45px;
      border: none;
      cursor: pointer;
      background: transparent;
    }

    .workspace {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 30px;
      box-shadow: 0 12px 35px rgba(112, 89, 120, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 600px;
      overflow: hidden;
    }

    .workspace::before {
      content: "✨";
      position: absolute;
      top: 30px;
      left: 40px;
      font-size: 30px;
    }

    .workspace::after {
      content: "🌸";
      position: absolute;
      right: 45px;
      bottom: 35px;
      font-size: 32px;
    }

    .design-area {
      text-align: center;
    }

    .design-area h2 {
      margin-bottom: 25px;
      font-size: 24px;
    }

    .shirt {
      width: 310px;
      height: 350px;
      background: white;
      position: relative;
      margin: auto;
      border-radius: 35px 35px 60px 60px;
      box-shadow: 0 18px 35px rgba(90, 75, 100, 0.2);
      transition: background 0.3s;
    }

    .shirt::before,
    .shirt::after {
      content: "";
      position: absolute;
      top: 25px;
      width: 115px;
      height: 120px;
      background: inherit;
      border-radius: 35px;
    }

    .shirt::before {
      left: -75px;
      transform: rotate(25deg);
    }

    .shirt::after {
      right: -75px;
      transform: rotate(-25deg);
    }

    .neck {
      width: 105px;
      height: 58px;
      background: #f3e9f3;
      border-radius: 0 0 60px 60px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .shirt-message {
      position: absolute;
      width: 100%;
      top: 160px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #8a718e;
      z-index: 3;
    }

    .status {
      margin-top: 24px;
      background: #fff8fc;
      padding: 12px 20px;
      border-radius: 20px;
      display: inline-block;
    }

    @media (max-width: 750px) {
      h1 {
        font-size: 48px;
      }

      .welcome-card {
        padding: 40px 25px;
      }

      .studio-layout {
        grid-template-columns: 1fr;
      }

      .shirt {
        transform: scale(0.75);
      }
    }
  </style>
</head>

<body>

  <!-- HOME PAGE -->

  <section id="homePage">

    <div class="floating" style="left: 8%; animation-delay: 0s;">✨</div>
    <div class="floating" style="left: 23%; animation-delay: 3s;">🌸</div>
    <div class="floating" style="left: 48%; animation-delay: 5s;">🧵</div>
    <div class="floating" style="left: 72%; animation-delay: 1s;">🌼</div>
    <div class="floating" style="left: 90%; animation-delay: 6s;">✨</div>

    <div class="welcome-card">
      <h1>Dream Threads</h1>

      <p class="tagline">
        Where imagination becomes fashion.
      </p>

      <button class="start-button" onclick="openStudio()">
        Start Designing
      </button>
    </div>

  </section>

  <!-- FASHION STUDIO -->

  <section id="studioPage">

    <header class="studio-header">
      <div class="studio-title">🧵 Dream Threads Studio</div>

      <button class="home-button" onclick="returnHome()">
        ← Home
      </button>
    </header>

    <div class="studio-layout">

      <aside class="sidebar">
        <h2>Creative Tools</h2>

        <button class="tool-button" onclick="showTemplates()">
  👕 Templates
</button>
        <div id="templatePanel" class="tool-panel">

  <button onclick="chooseTemplate('shirt')">
    👕 T-Shirt
  </button>

  <button onclick="chooseTemplate('dress')">
    👗 Dress
  </button>

  <button onclick="chooseTemplate('hoodie')">
    🧥 Hoodie
  </button>

</div>

        <button class="tool-button">
          ✏️ Draw
        </button>

        <button class="tool-button">
          🧵 Fabrics
        </button>

        <button class="tool-button">
          🌸 Decorations
        </button>

        <button class="tool-button">
          🖼️ Upload Image
        </button>

        <button class="tool-button">
          💾 Save Design
        </button>

        <div class="color-area">
          <label for="shirtColor">Choose a shirt color</label>

          <input
            type="color"
            id="shirtColor"
            value="#ffffff"
            oninput="changeShirtColor()"
          >
        </div>
      </aside>

      <main class="workspace">
        <div class="design-area">

          <h2>Your First Design</h2>

          <div class="shirt" id="shirt">
            <div class="neck"></div>

            <div class="shirt-message">
              Dream Big ✨
            </div>
          </div>

          <div class="status">
            Choose a color to begin creating!
          </div>

        </div>
      </main>

    </div>

  </section>

  <script>
    function openStudio() {
      document.getElementById("homePage").style.display = "none";
      document.getElementById("studioPage").style.display = "block";
    }

    function returnHome() {
      document.getElementById("studioPage").style.display = "none";
      document.getElementById("homePage").style.display = "flex";
    }

    function changeShirtColor() {
      const selectedColor =
        document.getElementById("shirtColor").value;

     document.getElementById("shirt").style.background =
    selectedColor;
}
      function showTemplates() {

  const panel = document.getElementById("templatePanel");


  if (panel.style.display === "block") {

    panel.style.display = "none";

  } else {

    panel.style.display = "block";

  }

}
    }
  </script>

</body>
</html>
