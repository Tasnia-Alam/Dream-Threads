<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Threads</title>

<style>

body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
180deg,
#fff8f8,
#ffeef6,
#f7efff,
#eef7ff
);

font-family:Arial, sans-serif;

overflow:hidden;

}

.container{

text-align:center;

}

h1{

font-size:70px;

color:#7a5c88;

margin-bottom:15px;

}

p{

font-size:22px;

color:#777;

margin-bottom:40px;

}

button{

padding:18px 40px;

font-size:22px;

border:none;

border-radius:50px;

background:#f6b8d7;

color:white;

cursor:pointer;

transition:.3s;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

button:hover{

transform:scale(1.08);

background:#ef9fc8;

}

.sparkle{

position:absolute;

font-size:22px;

animation:float 8s infinite linear;

opacity:.6;

}

@keyframes float{

0%{

transform:translateY(100vh);

}

100%{

transform:translateY(-120vh);

}

}

</style>

</head>

<body>

<div class="sparkle" style="left:10%;">✨</div>
<div class="sparkle" style="left:25%; animation-delay:2s;">🌸</div>
<div class="sparkle" style="left:50%; animation-delay:4s;">✨</div>
<div class="sparkle" style="left:70%; animation-delay:1s;">🧵</div>
<div class="sparkle" style="left:90%; animation-delay:6s;">🌼</div>

<div class="container">

<h1>Dream Threads</h1>

<p>Where imagination becomes fashion.</p>

<button>Start Designing</button>

</div>

</body>

</html>
